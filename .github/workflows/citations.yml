name: Refresh external metadata

on:
  schedule:
    # 06:20 UTC every Monday. Off the hour because scheduled jobs at :00 sit in
    # a much longer queue.
    - cron: '20 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: citations
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Uses only the standard library, so there is nothing to install.
      - name: Fetch citation counts from OpenAlex
        run: python3 scripts/update_citations.py

      - name: Fetch latest software releases from Zenodo
        run: python3 scripts/update_zenodo.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- src/data/publications.yml src/data/software.yml; then
            echo "No citation or release changes this week."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/publications.yml src/data/software.yml
          git commit -m "Refresh citation counts and software release metadata

          Generated by .github/workflows/citations.yml from OpenAlex and Zenodo.
          Citation counts and release versions only; no other metadata is
          touched by this job."
          git push
