# ---------------------------------------------------------------------------
# Publications for greglucas.github.io
#
# This file is the single source of truth for the /publications page. It is
# validated against the schema in src/content.config.ts at build time, so a
# typo in a field name or a missing required field fails the build rather than
# silently rendering wrong.
#
# To add a paper that has a DOI, do not edit this file by hand:
#
#     python3 scripts/add_pub.py 10.1029/2019SW002329
#
# That pulls title, authors, venue, volume, issue, pages and year straight from
# Crossref and inserts the entry in the right place. Entries without a DOI
# (reports, older conference papers and posters) are maintained by hand.
#
# `citations` and `citations_updated` are written by scripts/update_citations.py
# from OpenAlex and are refreshed weekly by .github/workflows/citations.yml.
# Do not edit them by hand.
#
# Every metadata field below for DOI-bearing entries was verified against
# Crossref rather than carried over from the old hand-written HTML.
#
# Fields: type (required)  journal | chapter | thesis | report | conference | poster
#         title, authors, year (required)
#         venue, book, institution, meeting, volume, issue, pages, article,
#         number, doi, url, links (optional)
# ---------------------------------------------------------------------------

