# ---------------------------------------------------------------------------
# Software for the /software page.
#
# `zenodo_concept_doi` is the Zenodo *concept* DOI, which always resolves to the
# latest release rather than to one frozen version. That is the DOI people
# should cite. Set it once by hand.
#
# `version`, `version_doi` and `released` underneath it are GENERATED by
# scripts/update_zenodo.py from that concept DOI, and refreshed weekly by
# .github/workflows/citations.yml. Do not edit them by hand.
#
#   python3 scripts/update_zenodo.py            # refresh
#   python3 scripts/update_zenodo.py --dry-run  # preview
#
# Packages with no Zenodo record simply omit zenodo_concept_doi; they render
# without a citation block.
# ---------------------------------------------------------------------------

maintained:
  - name: Matplotlib
    role: Maintainer
    href: https://github.com/matplotlib/matplotlib
    zenodo_concept_doi: 10.5281/zenodo.592536
    version: 3.11.1
    version_doi: 10.5281/zenodo.21422872
    released: 2026-07-18
    body: >-
      The plotting library underneath most of scientific Python. I review and merge changes across
      the codebase, with a focus on the rendering and colour-mapping internals.

  - name: Cartopy
    role: Maintainer
    href: https://github.com/scitools/cartopy
    zenodo_concept_doi: 10.5281/zenodo.1182735
    version: 0.24.1
    version_doi: 10.5281/zenodo.13905945
    released: 2024-10-08
    body: >-
      Cartographic projections and geospatial plotting for Python, built on top of Matplotlib. Used
      across the atmospheric, oceanographic and Earth science communities.

authored:
  - name: bezpy
    href: https://github.com/greglucas/bezpy
    zenodo_concept_doi: 10.5281/zenodo.3765860
    version: 0.1.1
    version_doi: 10.5281/zenodo.8395357
    released: 2023-09-30
    tags: [Geoelectric hazards, Python]
    body: >-
      Reading and working with the magnetotelluric, magnetic observatory and transmission-line data
      used in geoelectric hazard analysis. Written during my USGS postdoc and now used well beyond
      it.

  - name: pysecs
    href: https://github.com/greglucas/pysecs
    zenodo_concept_doi: 10.5281/zenodo.14511595
    version: 0.4.0
    version_doi: 10.5281/zenodo.21288007
    released: 2026-07-10
    tags: [Magnetic fields, Python]
    body: >-
      Spherical Elementary Current Systems: decomposes magnetic field observations into
      divergence-free basis functions, so interpolation and machine learning respect the underlying
      physics by construction.

  - name: pymsis
    href: https://swxtrec.github.io/pymsis/
    zenodo_concept_doi: 10.5281/zenodo.5348502
    version: 0.12.0
    version_doi: 10.5281/zenodo.17727617
    released: 2025-11-26
    tags: [Atmosphere, Python / Fortran]
    body: >-
      A Python interface to the NRLMSIS empirical atmosphere models. Wraps the original Fortran so
      the model can be called from a notebook, a web API or an operational pipeline without a
      compiler in the loop.

  - name: enlilviz
    href: https://github.com/SWxTREC/enlilviz
    tags: [Solar wind, Python]
    body: >-
      Visualization of Enlil solar wind model output — the animations and interactive plots space
      weather forecasters use in operational environments.

  - name: msis-api
    href: https://github.com/SWxTREC/msis-api
    tags: [Cloud, Serverless]
    body: >-
      The serverless API behind the MSIS Visualizer, turning a Fortran atmospheric model into
      something a browser can query directly.

reproducible:
  - name: GeoelectricHazardPaper2019
    href: https://github.com/greglucas/GeoelectricHazardPaper2019
    body: Every figure in the 100-year hazard analysis, as a runnable Jupyter notebook.

  - name: Lucas-Thesis
    href: https://github.com/greglucas/Lucas-Thesis
    body: Slides, source and the full text of my PhD thesis.
